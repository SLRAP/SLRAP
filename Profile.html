<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - SL RAP</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    color: #fff;
    font-family: Roboto, Arial, sans-serif;
    padding-bottom: 60px;
  }

.page-title {
  font-size: 22px;
  font-weight: 600;
  padding: 20px 16px 12px 16px;
  color: #fff;
}

.profile-header {
  display: flex;
  padding: 16px 16px 20px 16px;
  gap: 16px;
  align-items: flex-start;
}
.profile-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
}
.profile-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #333;
  flex-shrink: 0;
  overflow: hidden;
  margin-top: 3px;
  cursor: pointer;
}
.profile-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.channel-stats {
  font-size: 11px;
  color: #aaa;
  line-height: 1.5;
  text-align: left;
}
.channel-stats span {
  display: block;
}

.profile-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.profile-name {
  font-size: 20px;
  font-weight: 600;
  margin-top: -2px;
}
.profile-about {
  font-size: 13px;
  color: #aaa;
  line-height: 1.4;
}

.menu-list {
  padding: 0;
}
.menu-item {
  display: block;
  padding: 12px 16px;
  font-size: 16px;
  color: #fff;
  text-decoration: none;
}
.menu-item:active {
  background: #272727;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0f0f0f;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 6px 0;
    border-top: 1px solid #222;
  }
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: #aaa;
    text-decoration: none;
  }
.nav-item.active { color: #fff; }
.nav-item.active svg {
  fill: #fff;
}
.nav-item svg {
  width: 24px;
  height: 24px;
  fill: #aaa;
  transition: fill 0.2s;
}

/* Image Modal / Lightbox */
.image-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(20px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.image-modal.show {
  display: flex;
}
.image-modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 50%;
  box-shadow: 0 0 40px rgba(255,255,255,0.1);
}
.image-modal .close-modal {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.image-modal .close-modal:hover {
  opacity: 1;
}
.image-modal .close-modal svg {
  width: 40px;
  height: 40px;
  fill: #fff;
}
</style>
</head>
<body>

  <div class="page-title">Profile</div>

  <div class="profile-header">
    <div class="profile-left">
      <!-- Image click කරාම modal open වෙනවා -->
      <div class="profile-icon" onclick="openImageModal(this.querySelector('img').src)">
        <img src="icon1.jpg" alt="profile">
      </div>
      <div class="channel-stats">
        <span>Subscribers 125K</span>
        <span>Uploads 340 songs</span>
      </div>
    </div>
    <div class="profile-info">
      <div class="profile-name">Rasthiyadu Padanama</div>
      <div class="profile-about">Sri Lankan Hip Hop & Rap Music Channel.</div>
    </div>
  </div>

  <div class="menu-list">
    <a href="Edit_Profile.html" class="menu-item">Edit Profile</a>
    <a href="Save_Songs.html" class="menu-item">Save songs</a>
    <a href="History.html" class="menu-item">History</a>
    <a href="Uploads.html" class="menu-item">Uploads</a>
    <a href="Privacy_Policy.html" class="menu-item">Privacy Policy</a>
    <a href="Loging.html" class="menu-item">Logout</a>
  </div>

  <div class="bottom-nav">
    <a href="Home_Page.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <div>Home</div>
    </a>
    <a href="Trending.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      <div>Trending</div>
    </a>
    <a href="Subscriptions.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 8H4v10h16V8zm-2 8H6v-6h12v6zM6 6h12v2H6z"/></svg>
      <div>Subscriptions</div>
    </a>
    <a href="Profile.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <div>Profile</div>
    </a>
  </div>

  <!-- Image Modal -->
  <div class="image-modal" id="imageModal" onclick="closeImageModal(event)">
    <div class="close-modal">
      <svg viewBox="0 0 24 24">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </div>
    <img id="modalImage" src="" alt="">
  </div>

<script>
function openImageModal(src) {
  document.getElementById('modalImage').src = src;
  document.getElementById('imageModal').classList.add('show');
  document.body.style.overflow = 'hidden'; // scroll lock
}

function closeImageModal(e) {
  // X එක click කරොත් විතරක් close වෙනවා, image එක click කරාම close වෙන්නේ නෑ
  if(e.target.id === 'imageModal' || e.target.closest('.close-modal')) {
    document.getElementById('imageModal').classList.remove('show');
    document.body.style.overflow = 'auto';
  }
}
</script>

</body>
</html>
