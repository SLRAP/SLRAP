<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading - SL RAP</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0f0f0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.loading-container {
    text-align: center;
    color: #fff;
}

/* Logo Box - Border නැතුව logo එකට fit */
.logo-box {
    width: 140px;
    height: 140px;
    margin: 0 auto 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
}

.logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 20px;
}

/* Dots Animation - 8 seconds */
.dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 30px;
}

.dot {
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    animation: bounce 4s infinite;
}

.dot:nth-child(1) { animation-delay: 0s; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
.dot:nth-child(4) { animation-delay: 0.6s; }

@keyframes bounce {
    0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.3;
    }
    40% {
        transform: scale(1.2);
        opacity: 1;
    }
}

/* Text */
.text-bottom {
    font-size: 14px;
    color: #888;
    letter-spacing: 2px;
}

.text-bottom span {
    display: block;
    margin-top: 5px;
    font-size: 16px;
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="loading-container">
    <!-- Logo Box -->
    <div class="logo-box">
        <img src="Logo.png" alt="SL RAP Logo">
    </div>
    
    <!-- 4 Dots - 8s animation -->
    <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    
    <!-- Text -->
    <div class="text-bottom">
        for
        <span>Sri Lankan Rappers</span>
    </div>
</div>

</body>
</html>
