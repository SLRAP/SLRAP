<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SL RAP</title>

<!-- Google Identity Services Library -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    background: #080c14;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    padding: 40px 30px;
    background: rgba(18, 24, 38, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 12px 0;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .description-text {
    font-size: 13.5px;
    color: #94a3b8;
    line-height: 1.6;
    margin: 0 0 28px 0;
    text-align: left;
    background: rgba(15, 23, 42, 0.6);
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  /* Google Native Button Container Styling */
  .google-btn-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 48px;
    margin-top: 10px;
  }

  .checkbox-container {
    margin-top: 24px;
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .checkbox-container input[type="checkbox"] {
    accent-color: #3b82f6;
    width: 17px;
    height: 17px;
    cursor: pointer;
    border-radius: 4px;
  }

  .checkbox-container a {
    color: #60a5fa;
    text-decoration: none;
    font-weight: 500;
  }

  .checkbox-container a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>LOGIN</h1>
    
    <p class="description-text">
      Welcome to SL RAP! By continuing with Google authentication, you get seamless access to your customized dashboard, secure profile management, and premium features.
    </p>
    
    <!-- Google Native Official Button Slot -->
    <div class="google-btn-wrapper">
      <div id="googleSignInBtn"></div>
    </div>
    
    <div class="checkbox-container">
      <input type="checkbox" id="privacy">
      <label for="privacy">I Accept <a href="Privacy_Policy.html" target="_blank">Privacy Policy</a></label>
    </div>
  </div>

  <script>
    async function handleCredentialResponse(response) {
      const isAccepted = document.getElementById('privacy').checked;
      
      if (!isAccepted) {
        alert("Please accept the Privacy Policy before signing in!");
        return;
      }

      // JWT Decode
      const responsePayload = parseJwt(response.credential);

      localStorage.setItem("user_google_id", responsePayload.sub);
      localStorage.setItem("user_name", responsePayload.name);
      localStorage.setItem("user_email", responsePayload.email);
      localStorage.setItem("user_picture", responsePayload.picture);

      try {
        const res = await fetch('login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            google_id: responsePayload.sub,
            name: responsePayload.name,
            email: responsePayload.email,
            profile_pic: responsePayload.picture
          })
        });

        const data = await res.json();

        if (data.status === "success") {
          window.location.href = "Home_Page.html";
        } else {
          alert("Database Error: " + data.message);
        }
      } catch (error) {
        console.error("Login Fetch Error:", error);
        window.location.href = "Home_Page.html"; 
      }
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      return JSON.parse(jsonPayload);
    }

    function initGoogleBtn() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
          client_id: "140925428903-r1sltvfvsmovqo1qlq39dqcvgbihunnt.apps.googleusercontent.com",
          callback: handleCredentialResponse
        });

        // Official Google Button එක Render කිරීම
        google.accounts.id.renderButton(
          document.getElementById("googleSignInBtn"),
          { 
            theme: "outline", 
            size: "large",
            width: 320,
            text: "continue_with",
            shape: "pill"
          }
        );
      } else {
        setTimeout(initGoogleBtn, 200);
      }
    }

    window.onload = function () {
      initGoogleBtn();
    };
  </script>
</body>
</html>
