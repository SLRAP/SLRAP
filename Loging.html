<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SL RAP</title>
<style>
  body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
  }

  .container {
    width: 90%;
    max-width: 380px;
    padding: 20px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 30px;
  }

  p {
    font-size: 18px;
    margin: 20px 0 8px 0;
    color: #ccc;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 14px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 25px;
    color: white;
    font-size: 16px;
    box-sizing: border-box;
    outline: none;
    margin-bottom: 12px;
  }

  input:focus {
    border-color: #555;
  }

  .btn-google {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    background: white;
    color: black;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
  }

  .checkbox {
    margin: 25px 0 15px 0;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .checkbox a {
    color: #4da3ff;
    text-decoration: none;
  }

  .checkbox a:hover {
    text-decoration: underline;
  }

  .btn-next {
    width: 100%;
    padding: 14px;
    background: white;
    color: black;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>LOGIN</h1>
    
    <p>Already have a Account</p>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    
    <p>Not have a Account</p>
    
    <button class="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v8.51h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.14z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>
    
    <div class="checkbox">
      <input type="checkbox" id="privacy" required>
      <label for="privacy">I Accept <a href="Privacy_Policy.html" target="_blank">Privacy Policy</a></label>
    </div>
    
    <button class="btn-next">Next</button>
  </div>
</body>
</html>
