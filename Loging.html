<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SL RAP</title>

<!-- Google Identity Services Library -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    background: #0f0f0f;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .container {
    width: 100%;
    max-width: 380px;
    padding: 32px 24px;
    background: #141414;
    border: 1px solid #262626;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px 0;
    letter-spacing: 1px;
  }

  p {
    font-size: 14px;
    margin: 0 0 28px 0;
    color: #a3a3a3;
    line-height: 1.5;
  }

  /* Google Button Container Styling */
  .google-btn-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
    min-height: 44px;
  }

  .checkbox-container {
    margin-top: 24px;
    font-size: 13px;
    color: #a3a3a3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .checkbox-container input[type="checkbox"] {
    accent-color: #3b82f6;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  .checkbox-container a {
    color: #3b82f6;
    text-decoration: none;
  }

  .checkbox-container a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>LOGIN</h1>
    <p>Sign in with Google to access your account</p>
    
    <!-- Official Google Button Injection Area -->
    <div class="google-btn-wrapper">
      <div id="g_id_onload"></div>
    </div>
    
    <div class="checkbox-container">
      <input type="checkbox" id="privacy">
      <label for="privacy">I Accept <a href="Privacy_Policy.html" target="_blank">Privacy Policy</a></label>
    </div>
  </div>

  <script>
    function handleCredentialResponse(response) {
      const isAccepted = document.getElementById('privacy').checked;
      
      if (!isAccepted) {
        alert("Please accept the Privacy Policy to proceed!");
        return;
      }

      // JWT Token Decode කිරීම
      const responsePayload = parseJwt(response.credential);

      // User details LocalStorage හි තැන්පත් කිරීම
      localStorage.setItem("user_name", responsePayload.name);
      localStorage.setItem("user_email", responsePayload.email);
      localStorage.setItem("user_picture", responsePayload.picture);

      // Next Page එකට Redirect කිරීම
      window.location.href = "home.html"; 
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      return JSON.parse(jsonPayload);
    }

    window.onload = function () {
      // Google ID Initialization
      google.accounts.id.initialize({
        client_id: "140925428903-r1sltvfvsmovqo1qlq39dqcvgbihunnt.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      // Render Official Google Sign-In Button with High Quality Design
      google.accounts.id.renderButton(
        document.getElementById("g_id_onload"),
        { 
          theme: "filled_blue", // standard dark/blue UI (Options: "outline", "filled_blue", "filled_black")
          size: "large",         // Button Size (large, medium, small)
          shape: "pill",         // Rounded Corners / Capsule shape
          width: 320,            // Clean fixed width
          logo_alignment: "left"
        }
      );
    }
  </script>
</body>
</html>
