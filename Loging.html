<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SL RAP</title>

<!-- Google Identity Services Library -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    background: #080c14;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    padding: 40px 30px;
    background: rgba(18, 24, 38, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 12px 0;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .description-text {
    font-size: 13.5px;
    color: #94a3b8;
    line-height: 1.6;
    margin: 0 0 28px 0;
    text-align: left;
    background: rgba(15, 23, 42, 0.6);
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .custom-google-btn {
    width: 100%;
    height: 48px;
    background: #ffffff;
    color: #1f2937;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
  }

  .custom-google-btn:hover {
    background: #f8fafc;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
  }

  .custom-google-btn:active {
    transform: translateY(0);
  }

  .custom-google-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .custom-google-btn svg {
    width: 20px;
    height: 20px;
  }

  .checkbox-container {
    margin-top: 24px;
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .checkbox-container input[type="checkbox"] {
    accent-color: #3b82f6;
    width: 17px;
    height: 17px;
    cursor: pointer;
    border-radius: 4px;
  }

  .checkbox-container a {
    color: #60a5fa;
    text-decoration: none;
    font-weight: 500;
  }

  .checkbox-container a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>LOGIN</h1>
    
    <p class="description-text">
      Welcome to SL RAP! By continuing with Google authentication, you get seamless access to your customized dashboard, secure profile management, and premium features.
    </p>
    
    <button class="custom-google-btn" id="loginBtn" onclick="handleCustomGoogleLogin()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span id="btnText">Continue with Google</span>
    </button>
    
    <div class="checkbox-container">
      <input type="checkbox" id="privacy">
      <label for="privacy">I Accept <a href="Privacy_Policy.html" target="_blank">Privacy Policy</a></label>
    </div>
  </div>

  <script>
    function handleCustomGoogleLogin() {
      const isAccepted = document.getElementById('privacy').checked;
      
      if (!isAccepted) {
        alert("Please accept the Privacy Policy before signing in!");
        return;
      }

      // Trigger Google One Tap / Sign-In Prompt Directly
      google.accounts.id.prompt();
    }

    async function handleCredentialResponse(response) {
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      btnText.innerText = "Signing in...";

      // Google Token එක Decode කර ගැනීම
      const responsePayload = parseJwt(response.credential);

      // Local storage හි දත්ත තබා ගැනීම (Front-end UI සඳහා)
      localStorage.setItem("user_google_id", responsePayload.sub);
      localStorage.setItem("user_name", responsePayload.name);
      localStorage.setItem("user_email", responsePayload.email);
      localStorage.setItem("user_picture", responsePayload.picture);

      try {
        // Backend (`login.php`) වෙත Data යැවීම
        const res = await fetch('login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            google_id: responsePayload.sub,
            name: responsePayload.name,
            email: responsePayload.email,
            profile_pic: responsePayload.picture
          })
        });

        const data = await res.json();

        if (data.status === "success") {
          window.location.href = "home.html";
        } else {
          alert("Database Error: " + data.message);
          resetBtn();
        }
      } catch (error) {
        console.error("Login Fetch Error:", error);
        window.location.href = "home.html"; 
      }
    }

    function resetBtn() {
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      btn.disabled = false;
      btnText.innerText = "Continue with Google";
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      return JSON.parse(jsonPayload);
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "140925428903-r1sltvfvsmovqo1qlq39dqcvgbihunnt.apps.googleusercontent.com",
        callback: handleCredentialResponse,
        auto_select: false
      });
    }
  </script>
</body>
</html>
