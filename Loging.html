<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SL RAP</title>

<!-- Google Identity Services Library -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    background: #080c14;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    padding: 40px 30px;
    background: rgba(18, 24, 38, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 12px 0;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Description Box Styling */
  .description-text {
    font-size: 13.5px;
    color: #94a3b8;
    line-height: 1.6;
    margin: 0 0 28px 0;
    text-align: left;
    background: rgba(15, 23, 42, 0.6);
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  /* Custom Modern Google Button */
  .custom-google-btn {
    width: 100%;
    height: 48px;
    background: #ffffff;
    color: #1f2937;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
  }

  .custom-google-btn:hover {
    background: #f8fafc;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 255, 255, 0.15);
  }

  .custom-google-btn:active {
    transform: translateY(0);
  }

  .custom-google-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .custom-google-btn svg {
    width: 20px;
    height: 20px;
  }

  .checkbox-container {
    margin-top: 24px;
    font-size: 13px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .checkbox-container input[type="checkbox"] {
    accent-color: #3b82f6;
    width: 17px;
    height: 17px;
    cursor: pointer;
    border-radius: 4px;
  }

  .checkbox-container a {
    color: #60a5fa;
    text-decoration: none;
    font-weight: 500;
  }

  .checkbox-container a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>LOGIN</h1>
    
    <p class="description-text">
      Welcome to SL RAP! By continuing with Google authentication, you get seamless access to your customized dashboard, secure profile management, and premium features. Please ensure that you have reviewed our usage guidelines before signing in to proceed.
    </p>
    
    <!-- Custom Modern Google Button -->
    <button class="custom-google-btn" id="loginBtn" onclick="handleCustomGoogleLogin()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span id="btnText">Continue with Google</span>
    </button>
    
    <div class="checkbox-container">
      <input type="checkbox" id="privacy">
      <label for="privacy">I Accept <a href="Privacy_Policy.html" target="_blank">Privacy Policy</a></label>
    </div>
  </div>

  <script>
    function handleCustomGoogleLogin() {
      const isAccepted = document.getElementById('privacy').checked;
      
      if (!isAccepted) {
        alert("Please accept the Privacy Policy before signing in!");
        return;
      }

      // Trigger Google Sign-In Prompt
      google.accounts.id.prompt();
    }

    async function handleCredentialResponse(response) {
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');

      // Loading UI State
      btn.disabled = true;
      btnText.innerText = "Signing in...";

      // Decode Google JWT Token
      const responsePayload = parseJwt(response.credential);

      // Save locally for UI rendering
      localStorage.setItem("user_google_id", responsePayload.sub);
      localStorage.setItem("user_name", responsePayload.name);
      localStorage.setItem("user_email", responsePayload.email);
      localStorage.setItem("user_picture", responsePayload.picture);

      try {
        // Send User Data to PHP Backend -> Save to Aiven Database
        const res = await fetch('login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            google_id: responsePayload.sub,
            name: responsePayload.name,
            email: responsePayload.email,
            profile_pic: responsePayload.picture
          })
        });

        const data = await res.json();

        if (data.status === "success") {
          // Success Redirect
          window.location.href = "home.html";
        } else {
          alert("Backend Error: " + data.message);
          btn.disabled = false;
          btnText.innerText = "Continue with Google";
        }
      } catch (error) {
        console.error("Login Fetch Error:", error);
        // DB Fail වුණත් Frontend Access එක සඳහා redirect වීමට ඉඩ හැරීම (Development Phase එකේදී)
        window.location.href = "home.html"; 
      }
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      return JSON.parse(jsonPayload);
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "140925428903-r1sltvfvsmovqo1qlq39dqcvgbihunnt.apps.googleusercontent.com",
        callback: handleCredentialResponse,
        // Drive AppData Access Scope
        scope: "email profile https://www.googleapis.com/auth/drive.appdata"
      });
    }
  </script>
</body>
</html>
