<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL RAP - Home Page</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'SLFont';
    src: url('OldLondon.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  body {
    background: #0f0f0f;
    color: #fff;
    font-family: Roboto, Arial, sans-serif;
    padding-bottom: 60px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    background: #0f0f0f;
    z-index: 10;
    border-bottom: 1px solid #222;
  }
  .topbar .logo { 
    font-size: 24px; 
    font-weight: 900; 
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
  }
  .topbar .logo .sl { 
    color: #ff0000;
    font-family: 'SLFont', Impact, sans-serif;
  }
  .topbar .right-icons {
    display: flex;
    gap: 24px;
  }
  .topbar .right-icons a svg {
    width: 24px;
    height: 24px;
    fill: #aaa;
    cursor: pointer;
    transition: fill 0.2s;
  }
  .topbar .right-icons a:active svg {
    fill: #fff;
  }

  .channel-header {
    display: flex;
    padding: 16px;
    gap: 16px;
    align-items: flex-start;
  }
  .channel-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #333;
    flex-shrink: 0;
    overflow: hidden;
    margin-top: 3px;
    cursor: pointer;
  }
  .channel-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .channel-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 0;
  }
  .channel-name {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    margin-top: -2px;
  }
  .channel-about {
    font-size: 13px;
    color: #aaa;
    line-height: 1.4;
  }
  .subscribe-btn {
    margin-top: 8px;
    padding: 8px 16px;
    background: #fff;
    color: #0f0f0f;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    width: fit-content;
    transition: all 0.2s;
  }
  .subscribe-btn.subscribed {
    background: #272727;
    color: #aaa;
  }

  .video-list { padding: 8px 0; }
  .video-card { margin-bottom: 0; position: relative; }

  .thumbnail-link {
    display: block;
    width: 100%;
    aspect-ratio: 16/9;
    background: #222;
    text-decoration: none;
  }
  .thumbnail {
    width: 100%;
    height: 100%;
    background: #222;
  }
  .thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .video-info {
    display: flex;
    padding: 12px 16px 0 16px;
    gap: 12px;
    align-items: flex-start;
    position: relative;
  }
  .video-details {
    flex: 1;
    min-width: 0;
  }
  .video-title {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .menu-dots {
    padding: 4px;
    cursor: pointer;
    position: relative;
  }
  .menu-dots svg {
    width: 24px;
    height: 24px;
    fill: #aaa;
  }

  .save-menu {
    position: absolute;
    right: 40px;
    top: 0;
    background: #282828;
    border-radius: 4px;
    padding: 4px 0;
    min-width: 180px;
    display: none;
    z-index: 20;
    box-shadow: 0 4px 32px rgba(0,0,0,0.5);
  }
  .save-menu.show {
    display: block;
  }
  .save-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    color: #fff;
  }
  .save-item:hover {
    background: #3a3a3a;
  }
  .save-item svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    flex-shrink: 0;
  }
  .save-item.saved svg {
    fill: #fff;
    stroke: #fff;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0f0f0f;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 6px 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: #aaa;
    text-decoration: none;
  }
  .nav-item.active { color: #fff; }
  .nav-item.active svg { fill: #fff; }
  .nav-item svg {
    width: 24px;
    height: 24px;
    fill: #aaa;
    transition: fill 0.2s;
  }

  /* Image Modal Styling */
  .image-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .image-modal.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content-wrapper {
    position: relative;
    max-width: 90%;
    max-height: 90%;
  }
  .modal-content-wrapper img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 8px;
    object-fit: contain;
    display: block;
  }
  .close-modal {
    position: absolute;
    top: -40px;
    right: 0;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.2);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="logo"><span class="sl">SL</span> RAP</div>
    <div class="right-icons">
      <a href="Notifications.html">
        <svg viewBox="0 0 24 24">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
        </svg>
      </a>
      <a href="Search.html">
        <svg viewBox="0 0 24 24">
          <path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="channel-header">
    <div class="channel-icon profile-icon" onclick="openImageModal(this.querySelector('img').src)">
      <img src="icon1.jpg" alt="channel">
    </div>
    <div class="channel-info">
      <div class="channel-name">SL RAP</div>
      <div class="channel-about">Sri Lankan Hip Hop & Rap Music Channel.</div>
      <button class="subscribe-btn" onclick="toggleSubscribe(this)">Subscribe</button>
    </div>
  </div>

  <div class="video-list">
    <div class="video-card">
      <a href="Video_Player.html" class="thumbnail-link">
        <div class="thumbnail">
          <img src="thumb1.jpg" alt="">
        </div>
      </a>
      
      <div class="video-info">
        <div class="video-details">
          <div class="video-title">Hadahana 44 Kalliya x Rasthiyadu Padanama x Fill T</div>
        </div>
        
        <div class="menu-dots" onclick="toggleSaveMenu(this)">
          <svg viewBox="0 0 24 24">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <div class="save-menu">
            <div class="save-item" onclick="toggleSave(event, this)">
              <svg viewBox="0 0 24 24">
                <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
              </svg>
              <span>Save</span>
            </div>
            <div class="save-item" onclick="shareVideo(event)">
              <svg viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
              </svg>
              <span>Share</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="Home_Page.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <div>Home</div>
    </a>
    <a href="Trending.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      <div>Trending</div>
    </a>
    <a href="Subscriptions.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 8H4v10h16V8zm-2 8H6v-6h12v6zM6 6h12v2H6z"/></svg>
      <div>Subscriptions</div>
    </a>
    <a href="Profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <div>Profile</div>
    </a>
  </div>

  <!-- Image View Modal -->
  <div id="imageModal" class="image-modal" onclick="closeImageModal(event)">
    <div class="modal-content-wrapper">
      <span class="close-modal">&times;</span>
      <img id="modalImage" src="" alt="Full View">
    </div>
  </div>

<script>
function toggleSubscribe(btn) {
  btn.classList.toggle('subscribed');
  btn.textContent = btn.classList.contains('subscribed') ? 'Subscribed' : 'Subscribe';
}

function toggleSaveMenu(el) {
  event.stopPropagation();
  const menu = el.querySelector('.save-menu');
  document.querySelectorAll('.save-menu').forEach(m => {
    if(m !== menu) m.classList.remove('show');
  });
  menu.classList.toggle('show');
}

function toggleSave(e, el) {
  e.stopPropagation();
  el.classList.toggle('saved');
  const text = el.querySelector('span');
  text.textContent = el.classList.contains('saved') ? 'Saved' : 'Save';
  document.querySelectorAll('.save-menu').forEach(m => m.classList.remove('show'));
}

function shareVideo(e) {
  e.stopPropagation();
  alert('Share link copied');
  document.querySelectorAll('.save-menu').forEach(m => m.classList.remove('show'));
}

/* Image Modal Functions */
function openImageModal(src) {
  document.getElementById('modalImage').src = src;
  document.getElementById('imageModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeImageModal(e) {
  if (e.target.id === 'imageModal' || e.target.closest('.close-modal')) {
    document.getElementById('imageModal').classList.remove('show');
    document.body.style.overflow = 'auto';
  }
}

document.addEventListener('click', () => {
  document.querySelectorAll('.save-menu').forEach(m => m.classList.remove('show'));
});
</script>

</body>
</html>
