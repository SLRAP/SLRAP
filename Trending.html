<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending - SL RAP</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f0f;
    color: #fff;
    font-family: Roboto, Arial, sans-serif;
    padding-bottom: 60px;
  }

.category-title {
  font-size: 22px;
  font-weight: 600;
  padding: 20px 16px 12px 16px;
  color: #fff;
}

/* Video Card - Thumbnail + Channel + Title + 3 dots */
.video-card { margin-top: 0; position: relative; padding-bottom: 16px; }

/* Thumbnail link */
.thumbnail-link {
  display: block;
  width: 100%;
  aspect-ratio: 16/9;
  background: #222;
  text-decoration: none;
}
.thumbnail {
  width: 100%;
  height: 100%;
  background: #222;
}
.thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.video-info {
  display: flex;
  padding: 12px 16px 0 16px;
  gap: 12px;
  align-items: flex-start;
  position: relative;
}

/* Channel icon link */
.channel-link {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
  display: block;
}
.video-channel-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #333;
  overflow: hidden;
}
.video-channel-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.video-details {
  flex: 1;
  min-width: 0;
}
.video-title {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.menu-dots {
  font-size: 20px;
  color: #aaa;
  padding: 4px;
  cursor: pointer;
  position: relative;
}
.menu-dots svg {
  width: 24px;
  height: 24px;
  fill: #aaa;
}

/* Save Share menu */
.save-menu {
  position: absolute;
  right: 40px;
  top: 0;
  background: #282828;
  border-radius: 4px;
  padding: 4px 0;
  min-width: 180px;
  display: none;
  z-index: 20;
  box-shadow: 0 4px 32px rgba(0,0,0,0.5);
}
.save-menu.show {
  display: block;
}
.save-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  cursor: pointer;
  font-size: 14px;
  color: #fff;
}
.save-item:hover {
  background: #3a3a3a;
}
.save-item svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  flex-shrink: 0;
}
.save-item.saved svg {
  fill: #fff;
  stroke: #fff;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0f0f0f;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 6px 0;
  }
.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 10px;
    color: #aaa;
    text-decoration: none;
  }
.nav-item.active { color: #fff; }
.nav-item.active svg {
  fill: #fff;
}
.nav-item svg {
  width: 24px;
  height: 24px;
  fill: #aaa;
  transition: fill 0.2s;
}
</style>
</head>
<body>

  <!-- Category Title -->
  <div class="category-title">Trending</div>

  <!-- Video Card only -->
  <div class="video-card">
    <!-- Thumbnail click = video page එකට -->
    <a href="Video_Player.html" class="thumbnail-link">
      <div class="thumbnail">
        <img src="thumb1.jpg" alt="video thumbnail">
      </div>
    </a>
    
    <div class="video-info">
      <!-- Channel icon click = channel page එකට -->
      <a href="Channel_View.html" class="channel-link">
        <div class="video-channel-icon">
          <img src="icon1.jpg" alt="channel">
        </div>
      </a>
      
      <div class="video-details">
        <div class="video-title">Hadahana 44 Kalliya x Rasthiyadu Padanama x Fill T</div>
      </div>
      
      <!-- 3 dots menu -->
      <div class="menu-dots" onclick="toggleSaveMenu(this)">
        <svg viewBox="0 0 24 24">
          <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <div class="save-menu">
          <div class="save-item" onclick="toggleSave(event, this)">
            <svg viewBox="0 0 24 24">
              <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
            <span>Save</span>
          </div>
          <div class="save-item" onclick="shareVideo(event)">
            <svg viewBox="0 0 24 24">
              <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
            </svg>
            <span>Share</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Nav - link දැම්මා -->
  <div class="bottom-nav">
    <a href="Home_Page.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <div>Home</div>
    </a>
    <a href="Trending.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      <div>Trending</div>
    </a>
    <a href="Subscriptions.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M20 8H4v10h16V8zm-2 8H6v-6h12v6zM6 6h12v2H6z"/></svg>
      <div>Subscriptions</div>
    </a>
    <a href="Profile.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <div>Profile</div>
    </a>
  </div>

<script>
function toggleSaveMenu(el) {
  event.stopPropagation();
  const menu = el.querySelector('.save-menu');
  document.querySelectorAll('.save-menu').forEach(m => {
    if(m !== menu) m.classList.remove('show');
  });
  menu.classList.toggle('show');
}

function toggleSave(e, el) {
  e.stopPropagation();
  el.classList.toggle('saved');
  const text = el.querySelector('span');
  text.textContent = el.classList.contains('saved') ? 'Saved' : 'Save';
  document.querySelectorAll('.save-menu').forEach(m => m.classList.remove('show'));
}

function shareVideo(e) {
  e.stopPropagation();
  alert('Share link copied');
  document.querySelectorAll('.save-menu').forEach(m => m.classList.remove('show'));
}

document.addEventListener('click', () => {
  document.querySelectorAll('.save-menu').forEach(m => m.classList.remove('show'));
});
</script>

</body>
</html>
