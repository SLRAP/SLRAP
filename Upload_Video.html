<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Playlist</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0f0f;
  color: #fff;
  font-family: Roboto, Arial, sans-serif;
  padding: 20px 16px 80px 16px;
  max-width: 600px;
  margin: 0 auto;
}
.page-title {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 24px;
  padding-top: 10px;
}
.input-box {
  width: 100%;
  background: #272727;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 14px 16px;
  color: #fff;
  font-size: 16px;
  outline: none;
  margin-bottom: 20px;
}
.input-box:focus { border: 1px solid #3ea6ff; }
.video-item {
  display: none;
  margin-bottom: 24px;
}
.video-item.show { display: block; }
.thumbnail-box {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}
.thumbnail-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.video-title {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
  margin-bottom: 24px;
  color: #fff;
}

/* Upload buttons wrapper */
.upload-buttons {
  display: none;
  gap: 12px;
  margin-bottom: 24px;
}
.upload-buttons.show { display: flex; }
.upload-buttons.single.upload-btn {
  width: 100%;
}
.upload-buttons.double.upload-btn {
  width: calc(50% - 6px);
}

.upload-btn {
  background: #fff;
  color: #0f0f0f;
  border: none;
  border-radius: 24px;
  padding: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: none;
  transition: all 0.2s;
}
.upload-btn.show { display: block; }
.upload-btn:active { background: #e0e0e0; transform: scale(0.98); }
.upload-btn:disabled { background: #555; color: #999; cursor: not-allowed; }

/* Playlist list */
.playlist-videos {
  display: none;
  margin-top: 20px;
  max-height: 400px;
  overflow-y: auto;
}
.playlist-videos.show { display: block; }
.playlist-item {
  display: flex;
  gap: 12px;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 8px;
  background: #1a1a1a;
}
.playlist-item:hover { background: #272727; }
.playlist-item.active { background: #3a3a3a; }
.playlist-thumb {
  width: 120px;
  height: 68px;
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
}
.playlist-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.playlist-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.playlist-title {
  font-size: 14px;
  font-weight: 500;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Bottom Nav with links */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f0f0f;
  border-top: 1px solid #272727;
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  max-width: 600px;
  margin: 0 auto;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: #aaa;
  font-size: 10px;
  cursor: pointer;
  text-decoration: none;
}
.nav-item.active { color: #fff; }
.nav-item svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}
.error-text {
  color: #ff4e4e;
  font-size: 14px;
  text-align: center;
  padding: 40px 20px;
}
</style>
</head>
<body>

<h1 class="page-title">Upload</h1>

<input type="text" id="videoLink" class="input-box" placeholder="Paste YouTube link or playlist link here">

<div class="video-item" id="videoItem">
  <div class="thumbnail-box">
    <img id="thumbImg" src="" alt="Thumbnail">
  </div>
  <div class="video-title" id="videoTitle"></div>
</div>

<div class="playlist-videos" id="playlistVideos"></div>

<!-- Upload buttons - screen එක දෙකට බෙදෙනවා -->
<div class="upload-buttons" id="uploadButtons">
  <button class="upload-btn" id="videoBtn" onclick="uploadVideo()">Video</button>
  <button class="upload-btn" id="playlistBtn" onclick="uploadPlaylist()">Playlist</button>
</div>

<!-- Bottom Navigation - links වැඩ -->
<div class="bottom-nav">
  <a href="Home_Page.html" class="nav-item active">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </a>
  <a href="Trending.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
    <span>Trending</span>
  </a>
  <a href="Subscriptions.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M20 8H4v10h16V8zm-2 8H6v-6h12v6zM6 6h12v2H6z"/></svg>
    <span>Subscriptions</span>
  </a>
  <a href="Profile.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    <span>Profile</span>
  </a>
</div>

<script>
const API_KEY = 'AIzaSyDgGPIoJk7KTjBDD2iLxjCeEJg_-eV2XVM';

const videoLink = document.getElementById('videoLink');
const videoItem = document.getElementById('videoItem');
const thumbImg = document.getElementById('thumbImg');
const videoTitle = document.getElementById('videoTitle');
const uploadButtons = document.getElementById('uploadButtons');
const videoBtn = document.getElementById('videoBtn');
const playlistBtn = document.getElementById('playlistBtn');
const playlistVideos = document.getElementById('playlistVideos');

let currentVideoData = null;
let playlistData = [];
let isPlaylistMode = false;

function getPlaylistId(url) {
  const match = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
  return match? match[1] : null;
}

function getVideoId(url) {
  const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
  const match = url.match(regExp);
  return (match && match[7].length === 11)? match[7] : null;
}

let debounceTimer;
videoLink.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(fetchVideoInfo, 500);
});

async function fetchVideoInfo() {
  const url = videoLink.value.trim();
  hideAll();

  if(url.length < 5) return;

  const playlistId = getPlaylistId(url);
  const videoId = getVideoId(url);

  if(playlistId) {
    isPlaylistMode = true;
    fetchPlaylist(playlistId);
  } else if(videoId) {
    isPlaylistMode = false;
    fetchSingleVideo(videoId);
  } else if(url.length > 5) {
    showError();
  }
}

async function fetchPlaylist(playlistId) {
  try {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}`
    );
    const data = await res.json();

    if(!data.items || data.items.length === 0) {
      showError();
      return;
    }

    playlistData = data.items;

    const firstVideo = data.items[0].snippet;
    showVideo(firstVideo.thumbnails.maxres?.url || firstVideo.thumbnails.high.url, firstVideo.title);
    currentVideoData = {
      videoId: firstVideo.resourceId.videoId,
      title: firstVideo.title,
      thumbnail: firstVideo.thumbnails.maxres?.url || firstVideo.thumbnails.high.url
    };

    playlistVideos.innerHTML = '';
    data.items.forEach((item, index) => {
      const snippet = item.snippet;
      const div = document.createElement('div');
      div.className = 'playlist-item' + (index === 0? ' active' : '');
      div.innerHTML = `
        <div class="playlist-thumb">
          <img src="${snippet.thumbnails.default.url}" alt="">
        </div>
        <div class="playlist-info">
          <div class="playlist-title">${snippet.title}</div>
        </div>
      `;
      div.onclick = () => selectPlaylistVideo(snippet, div);
      playlistVideos.appendChild(div);
    });
    playlistVideos.classList.add('show');

    // Playlist නම් බට්න් 2 - screen එක 50/50 බෙදෙනවා + gap 12px
    uploadButtons.className = 'upload-buttons double show';
    videoBtn.textContent = 'Video';
    playlistBtn.textContent = 'Playlist';
    videoBtn.classList.add('show');
    playlistBtn.classList.add('show');

  } catch(e) {
    console.log(e);
    showError();
  }
}

function selectPlaylistVideo(snippet, element) {
  document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
  element.classList.add('active');

  showVideo(snippet.thumbnails.maxres?.url || snippet.thumbnails.high.url, snippet.title);
  currentVideoData = {
    videoId: snippet.resourceId.videoId,
    title: snippet.title,
    thumbnail: snippet.thumbnails.maxres?.url || snippet.thumbnails.high.url
  };
}

async function fetchSingleVideo(videoId) {
  try {
    const res = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${API_KEY}`
    );
    const data = await res.json();

    if(!data.items || data.items.length === 0) {
      showError();
      return;
    }

    const snippet = data.items[0].snippet;
    showVideo(snippet.thumbnails.maxres?.url || snippet.thumbnails.high.url, snippet.title);
    currentVideoData = {
      videoId,
      title: snippet.title,
      thumbnail: snippet.thumbnails.maxres?.url || snippet.thumbnails.high.url
    };

    // Video නම් full width center
    uploadButtons.className = 'upload-buttons single show';
    videoBtn.textContent = 'Upload';
    videoBtn.classList.add('show');
    playlistBtn.classList.remove('show');

  } catch(e) {
    console.log(e);
    showError();
  }
}

function showVideo(thumb, title) {
  thumbImg.src = thumb;
  videoTitle.textContent = title;
  videoItem.classList.add('show');
}

function hideAll() {
  videoItem.classList.remove('show');
  playlistVideos.classList.remove('show');
  uploadButtons.classList.remove('show');
  videoBtn.classList.remove('show');
  playlistBtn.classList.remove('show');
}

function showError() {
  const thumbBox = document.querySelector('.thumbnail-box');
  thumbBox.innerHTML = '<div class="error-text">Invalid link</div>';
  thumbBox.style.display = 'flex';
}

function uploadVideo() {
  if(!currentVideoData) return;
  if(isPlaylistMode) {
    alert('Uploading single video: ' + currentVideoData.title);
  } else {
    alert('Uploading: ' + currentVideoData.title);
  }
}

function uploadPlaylist() {
  if(!playlistData || playlistData.length === 0) return;
  alert('Uploading full playlist: ' + playlistData.length + ' videos');
}
</script>

</body>
</html>
